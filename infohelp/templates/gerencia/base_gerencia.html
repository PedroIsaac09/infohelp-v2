{% load static %}

<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Gerenciamento - InfoHelp{% endblock title %}</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
        rel="stylesheet"
    />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                },
            },
        };
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full group/design-root">
        <!-- SideNavBar - Apenas botão Sair -->
        <div class="flex-shrink-0 w-20 bg-white dark:bg-background-dark border-r border-gray-200 dark:border-gray-800">
            <div class="flex flex-col h-full p-4 justify-end">
                <a
                    href="{% url 'listar_cursos' %}"
                    class="flex flex-col items-center gap-2 px-3 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-primary/20 transition"
                    title="Sair"
                >
                    <span class="material-symbols-outlined text-gray-800 dark:text-gray-300">logout</span>
                    <p class="text-gray-800 dark:text-gray-300 text-xs font-medium">
                        Sair
                    </p>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
